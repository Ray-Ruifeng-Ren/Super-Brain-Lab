# 珠象网站(自建服务器版)。对应线上 Netlify 的 public/_redirects + public/_headers,路径完全一致,前端不用改。
# 证书放到 /etc/nginx/certs/ 后,把下面 https 段的注释去掉、并打开 80 → 443 跳转。

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/acme; }   # 申请免费证书时验证域名用
  # 有证书后:删掉下面这行 include,换成 location / { return 301 https://$host$request_uri; }
  include /etc/nginx/conf.d/site.inc;
}

